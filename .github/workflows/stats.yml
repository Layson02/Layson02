name: Update README cards

on:
  schedule:
    - cron: "16 0 * * *"
      timezone: "America/Sao_Paulo"
  workflow_dispatch:

concurrency:
  group: update-readme-cards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=Layson02&show_icons=true&theme=dark&count_private=true&include_all_commits=true
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN }}
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=Layson02&layout=compact&theme=dark&count_private=true&langs_count=10
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_TOKEN }}
          fail_on_error: true

      - name: Inspect generated cards
        run: |
          echo "Generated files:"
          ls -lh profile/*.svg
          echo "Changes:"
          git status --short
          git diff --stat

          if git diff --quiet -- profile/top-langs.svg; then
            echo "top-langs.svg was generated but did not change."
          else
            echo "top-langs.svg changed."
          fi

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg

          if git diff --cached --quiet; then
            echo "No card changes detected."
            exit 0
          fi

          git commit -m "Update README stats cards"
          git push
